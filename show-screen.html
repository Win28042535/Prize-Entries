<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Lucky Draw Show Screen</title>
<link rel="preload" href="prize-assets/fonts/fc-minimal-600-900.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face{font-family:"FC Minimal";src:url("prize-assets/fonts/fc-minimal-100-500.ttf") format("truetype");font-weight:100 500;font-display:swap}
  @font-face{font-family:"FC Minimal";src:url("prize-assets/fonts/fc-minimal-600-900.ttf") format("truetype");font-weight:600 900;font-display:swap}
  @font-face{font-family:"Baskervville";src:url("prize-assets/fonts/baskervville-400-700.ttf") format("truetype");font-weight:400 700;font-display:swap}

  /* ---- Design DNA: BetterTrade 2026 ---- */
  :root{
    --ink:#111318; --ink-2:#687078; --ink-3:#687078;   /* DNA secondary text */
    --line:rgba(17,19,24,.14);
    --blue:#6598FF; --blue-ink:#1863DC; --blue-tint:rgba(234,242,255,.78);
    --banner:linear-gradient(180deg,#0B0D14 0%,#1B2240 100%);
    --rim:linear-gradient(90deg,#00d4fe,#1f87e6,#113cf3,#722df4,#e63bd8,#f79319);
    --serif:"Baskervville","Times New Roman",serif;
    --sans:"FC Minimal",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0B0D14;overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}

  /* fixed 1920x1080 canvas, scaled to the window (letterboxed) */
  /* the 1920px stage lives in a clipping, viewport-sized box so it never makes the page wider than the screen */
  #frame{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
    background:linear-gradient(180deg,#F6F7FB 0%,#E9EDF6 100%)}
  .bg{position:absolute;inset:0;background:url("prize-assets/img/room-bg-1920.webp") center/cover no-repeat;opacity:.92}
  .beams{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;opacity:.75}
  .beam{position:absolute;top:0;width:260px;height:150%;filter:blur(30px);transform-origin:top center;
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0) 75%);animation:sway 12s ease-in-out infinite alternate}
  .beam:nth-child(1){left:38%;transform:rotate(18deg)}
  .beam:nth-child(2){left:55%;transform:rotate(26deg);width:160px;animation-delay:-4s}
  .beam:nth-child(3){left:70%;transform:rotate(34deg);width:120px;animation-delay:-8s;
    background:linear-gradient(180deg,rgba(180,200,255,.8),rgba(255,255,255,0) 70%)}
  @keyframes sway{to{margin-left:-80px}}
  .floor{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.75))}

  /* glass elements stay at the edges so the centre is free for names */
  .el{position:absolute;filter:drop-shadow(0 26px 30px rgba(63,111,224,.22));animation:bob 6s ease-in-out infinite}
  .el.candle{left:60px;top:300px;width:250px;animation-delay:-1s}
  .el.gold{left:250px;bottom:120px;width:150px;animation-delay:-3s}
  .el.heart{left:300px;top:120px;width:96px;animation-delay:-2s}
  .el.coin{right:110px;top:110px;width:220px;animation-delay:-4s}
  .el.gift{right:120px;bottom:120px;width:230px;animation-delay:-5s}
  .el.gem{right:380px;bottom:330px;width:100px;animation-delay:-1.5s}
  @keyframes bob{50%{transform:translateY(-18px) rotate(-3deg)}}

  .top{position:absolute;left:96px;right:96px;top:64px;display:flex;justify-content:space-between;align-items:center;z-index:5}
  .top img{height:46px}
  .eyebrow{font-family:var(--serif);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:inline-flex;align-items:center;gap:16px;font-size:24px}
  .eyebrow::after{content:"";width:96px;height:1px;background:var(--ink);opacity:.5}
  .eyebrow i{font-style:normal;font-size:16px;color:var(--ink)}

  /* scenes */
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    opacity:0;transform:translateY(24px) scale(.985);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:4}
  .scene.on{opacity:1;transform:none}
  .k{font-family:var(--serif);letter-spacing:.1em;text-transform:uppercase;font-size:26px;color:var(--blue-ink);display:flex;align-items:center;gap:18px;justify-content:center}
  .k::before,.k::after{content:"";width:72px;height:1px;background:currentColor;opacity:.6}

  /* idle */
  .idle img{width:1080px;filter:drop-shadow(0 20px 40px rgba(17,19,24,.18))}
  .idle .k{margin-top:46px}
  .idle p{margin-top:18px;font-size:34px;color:var(--ink-2)}

  /* prize */
  .prize h2{font-weight:600;font-size:150px;line-height:1.05;margin:28px 0 22px;letter-spacing:-.01em}
  .prize .qty{font-size:34px;color:var(--ink-2)}
  .prize .qty b{font-weight:500;font-size:54px;color:var(--ink);margin:0 6px}
  .rule{margin-top:44px;display:inline-flex;align-items:stretch;border:1px solid var(--line);background:rgba(255,255,255,.72);backdrop-filter:blur(8px)}
  .rule div{padding:20px 36px;text-align:left}
  .rule div+div{border-left:1px solid var(--line)}
  .rule small{display:block;font-size:20px;color:var(--ink-3)}
  .rule span{font-size:32px;font-weight:500}
  .rule .num{font-size:44px;font-weight:500;line-height:1}

  /* drawing */
  .deck{position:relative;width:300px;aspect-ratio:1418/1985;margin:34px 0 40px}
  .deck img{position:absolute;inset:0;width:100%;height:100%;border-radius:18px;box-shadow:0 30px 50px -20px rgba(17,19,24,.5)}
  .drawing.on .deck img{animation:shuffle .6s ease-in-out infinite;animation-delay:calc(var(--i) * -.2s)}
  @keyframes shuffle{0%,100%{transform:none}30%{transform:translateX(-120px) rotate(-10deg)}60%{transform:translateX(120px) rotate(10deg);z-index:2}}
  .drawing .deck{width:210px;margin:30px 0 18px}
  .count{font-size:260px;font-weight:500;line-height:1;min-height:260px;color:var(--ink)}
  .count.tick{animation:tick .9s cubic-bezier(.2,.8,.2,1)}
  @keyframes tick{from{transform:scale(1.35);opacity:0;color:var(--blue-ink)}to{transform:none;opacity:1}}
  .drawing .sub{font-size:30px;color:var(--ink-2);margin-top:4px}

  /* redraw interstitial */
  .redraw h2{font-weight:600;font-size:110px;margin-top:24px}
  .redraw p{font-size:34px;color:var(--ink-2);margin-top:16px}

  /* reveal */
  /* reveal: name and prize lead, the character card supports from the side */
  .reveal{flex-direction:row;gap:72px}
  .side{flex:none;width:260px;display:flex;flex-direction:column;align-items:center;gap:16px;transform:rotate(4deg);margin-top:-70px}
  .side .char{font-size:24px;color:var(--blue-ink);transform:rotate(-4deg)}
  .flip{width:260px;aspect-ratio:1418/1985;perspective:1600px;flex:none}
  .flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.9,.2,1)}
  .flip.on .flip-in{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;overflow:hidden;
    box-shadow:0 40px 70px -26px rgba(63,111,224,.6),0 0 0 1px rgba(255,255,255,.6)}
  .face.front{transform:rotateY(180deg)}
  .face img,.face video{display:block;width:100%;height:100%;object-fit:cover}
  .flip.solo .flip-in{transform:none}
  .who{width:1080px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .who .crown{width:92px;height:92px;display:block;filter:drop-shadow(0 10px 16px rgba(63,111,224,.3))}
  .lucky{margin-top:10px;font-size:36px;color:var(--ink-2);display:flex;align-items:center;gap:14px}
  .lucky i{font-style:normal;font-size:22px;color:var(--ink)}
  /* font size is fitted to the width in JS so long names stay on one line */
  .who h1{font-weight:600;font-size:170px;line-height:1.15;margin:6px 0 0;letter-spacing:-.01em;white-space:nowrap}
  .who .pline{margin-top:18px;font-size:84px;font-weight:600;line-height:1.15;color:var(--blue-ink)}
  .who .meta{margin-top:24px;font-size:28px;color:var(--ink-3)}

  /* board */
  .board h2{font-family:var(--serif);font-weight:400;font-size:96px;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 40px}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:1374px}
  .tile{width:330px;display:flex;gap:16px;align-items:center;text-align:left;padding:14px;background:rgba(255,255,255,.82);border:1px solid var(--line);backdrop-filter:blur(6px)}
  .tile img{width:70px;aspect-ratio:1418/1985;border-radius:8px;flex:none;object-fit:cover}
  .tile b{display:block;font-size:26px;font-weight:600;line-height:1.2}
  .tile small{display:block;font-size:20px;color:var(--blue-ink);margin-top:4px}
  .board .empty{font-size:34px;color:var(--ink-3)}

  #confetti{position:absolute;inset:0;z-index:6;pointer-events:none}
  .guide{position:absolute;inset:54px 96px;border:2px dashed rgba(229,59,216,.7);z-index:9;display:none;pointer-events:none}
  .guide::after{content:"SAFE AREA 1920×1080 · 5%";position:absolute;left:12px;top:8px;font:600 18px var(--sans);color:#e63bd8}
  body.show-guide .guide{display:block}
  .demo-badge{display:none;position:absolute;right:96px;bottom:36px;z-index:8;padding:8px 18px;border-radius:999px;font-size:20px;
    color:var(--ink-2);background:rgba(255,255,255,.8);border:1px solid var(--line)}
  .demo-badge b{font-family:var(--serif);font-weight:400;letter-spacing:.1em;margin-right:8px;color:var(--blue-ink)}
  body.is-demo .demo-badge{display:block}

  /* running list of winners along the bottom edge */
  .ticker{position:absolute;left:0;right:0;bottom:0;height:76px;z-index:5;display:none;align-items:center;overflow:hidden;
    background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .ticker .lbl{flex:none;height:100%;display:flex;align-items:center;padding:0 28px 0 96px;background:var(--banner);color:#fff;
    font-family:var(--serif);letter-spacing:.1em;font-size:20px;text-transform:uppercase;position:relative;z-index:1}
  .ticker .viewport{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
  .ticker .track{display:flex;gap:64px;white-space:nowrap;padding-left:40px;font-size:26px;color:var(--ink-2)}
  .ticker .track.run{animation:marquee var(--dur,30s) linear infinite}
  .ticker .track span{display:inline-flex;align-items:center;gap:12px}
  .ticker .track img{width:32px;height:32px}
  .ticker .track b{color:var(--ink);font-weight:600}
  @keyframes marquee{to{transform:translateX(-50%)}}
  body.has-ticker .ticker{display:flex}
  body.has-ticker .demo-badge{bottom:96px}

  /* demo controls: outside the scaled stage, shown on mouse move */
  .demo-bar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);z-index:20;display:none;gap:6px;align-items:center;padding:6px;
    max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none;
    border-radius:999px;background:rgba(17,19,24,.82);backdrop-filter:blur(8px);opacity:0;transition:opacity .3s,transform .3s;font-family:var(--sans)}
  body.is-demo .demo-bar{display:flex}
  body.bar-on .demo-bar{opacity:1;transform:translate(-50%,0)}
  .demo-bar button{font:inherit;font-size:14px;color:#fff;background:none;border:0;cursor:pointer;height:44px;padding:0 14px;border-radius:999px;white-space:nowrap;flex:none}
  .demo-bar button:hover{background:rgba(255,255,255,.12)}
  .demo-bar button[aria-pressed="true"]{background:#fff;color:var(--ink)}
  .demo-bar .sep{width:1px;height:20px;background:rgba(255,255,255,.25);margin:0 4px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="frame">
<div id="stage">
  <div class="bg"></div>
  <div class="beams"><div class="beam"></div><div class="beam"></div><div class="beam"></div></div>
  <div class="floor"></div>

  <img class="el candle" src="prize-assets/img/candle.png" alt="">
  <img class="el gold" src="prize-assets/img/gold.png" alt="">
  <img class="el heart" src="prize-assets/img/heart.png" alt="">
  <img class="el coin" src="prize-assets/img/bitcoin.png" alt="">
  <img class="el gift" src="prize-assets/img/ICON_GIFT_PNG.png" alt="">
  <img class="el gem" src="prize-assets/img/diamond.png" alt="">

  <div class="top">
    <img src="prize-assets/img/efinBT.png" alt="efin | BetterTrade">
    <span class="eyebrow">Better Trade 2026 <i>✦</i> Lucky Draw</span>
  </div>

  <section class="scene idle" data-scene="idle">
    <img src="prize-assets/img/nwnp.png" alt="New World New Playbook · Better Trade 2026">
    <div class="k">Lucky Draw</div>
    <p>ลุ้นรางวัลพิเศษสำหรับผู้ร่วมงาน</p>
  </section>

  <section class="scene prize" data-scene="prize">
    <div class="k">Next Prize</div>
    <h2 id="pName"></h2>
    <div class="qty">รางวัลนี้มีทั้งหมด <b id="pQty"></b> รางวัล</div>
    <div class="rule">
      <div><small>สุ่มจาก</small><span id="pPool"></span></div>
      <div><small>ผู้มีสิทธิ์ลุ้น</small><span class="num" id="pCount"></span></div>
    </div>
  </section>

  <section class="scene drawing" data-scene="drawing">
    <div class="k">Drawing</div>
    <div class="deck">
      <img src="prize-assets/cards/back.webp" alt="" style="--i:0">
      <img src="prize-assets/cards/back.webp" alt="" style="--i:1">
      <img src="prize-assets/cards/back.webp" alt="" style="--i:2">
    </div>
    <div class="count" id="count"></div>
    <div class="sub" id="dSub"></div>
  </section>

  <section class="scene redraw" data-scene="redraw">
    <div class="k">Redraw</div>
    <h2>สุ่มรางวัลอีกครั้ง</h2>
    <p id="rSub"></p>
  </section>

  <section class="scene reveal" data-scene="reveal">
    <div class="who">
      <img class="crown" src="prize-assets/img/ICON_CROWN_PNG.png" alt="">
      <div class="lucky"><i>✦</i>ผู้โชคดี<i>✦</i></div>
      <h1 id="wName"></h1>
      <div class="pline" id="wLine"></div>
      <div class="meta" id="wMeta"></div>
    </div>
    <div class="side"><div id="card"></div><div id="wSide"></div></div>
  </section>

  <section class="scene board" data-scene="board">
    <div class="k">Better Trade 2026</div>
    <h2>Winners</h2>
    <div id="grid"></div>
  </section>

  <section class="scene blank" data-scene="blank"></section>

  <canvas id="confetti" width="1920" height="1080"></canvas>
  <div class="guide"></div>
  <div class="demo-badge"><b>DEMO</b>ตัวอย่างการแสดงผล</div>
  <div class="ticker"><div class="lbl">Winners</div><div class="viewport"><div class="track" id="track"></div></div></div>
</div>
</div>

<div class="demo-bar" id="demoBar" role="toolbar" aria-label="ควบคุมตัวอย่าง">
  <button data-demo="idle">หน้ารอ</button>
  <button data-demo="prize">ประกาศรางวัล</button>
  <button data-demo="drawing">นับถอยหลัง</button>
  <button data-demo="reveal">ผู้ชนะ</button>
  <button data-demo="board">ตารางผู้ชนะ</button>
  <span class="sep"></span>
  <button id="demoPause">หยุด</button>
  <button id="demoFs">เต็มจอ</button>
</div>

<script src="prize-assets/prize-data.js"></script>
<script>
const D = window.PRIZE_DATA;
const $ = s => document.querySelector(s);
const stage = $("#stage");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// size from the layout viewport (clientWidth/Height), not innerWidth: on phones innerWidth follows pinch-zoom
function fit(){
  const el = document.documentElement;
  const s = Math.min(el.clientWidth / 1920, el.clientHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

// browsers only allow fullscreen after a click/key in this page, so: F, double-click, or the demo bar button
const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
addEventListener("keydown", e => {
  if(e.key === "f" || e.key === "F") toggleFs();
  if(e.key === "g" || e.key === "G") document.body.classList.toggle("show-guide");
});
addEventListener("dblclick", toggleFs);

// records may have "-" as an empty surname (e.g. "Nathaporn -"): don't show it
const nm = s => String(s).replace(/(\s+-)+\s*$/, "").trim() || String(s);

let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function go(scene){
  document.querySelectorAll(".scene").forEach(s => s.classList.toggle("on", s.dataset.scene === scene));
  if(scene !== "reveal"){ $("#card").innerHTML = ""; parts = []; emitUntil = 0; }
  const chip = scene === "redraw" ? "drawing" : scene;
  document.querySelectorAll("#demoBar [data-demo]").forEach(b => b.setAttribute("aria-pressed", b.dataset.demo === chip));
}

// bottom ticker: "ตั๋วเครื่องบิน ที่ 1: ชื่อ"; scrolls only when it doesn't fit
function renderTicker(list){
  document.body.classList.toggle("has-ticker", list.length > 0);
  const track = $("#track");
  const item = w => `<span><img src="prize-assets/img/ICON_CROWN_PNG.png" alt="">${esc(w.prize)} ที่ ${w.no}: <b>${esc(nm(w.n))}</b></span>`;
  const one = list.slice().reverse().map(item).join("");
  track.classList.remove("run");
  track.innerHTML = one;
  if(track.scrollWidth > track.parentElement.clientWidth){
    track.innerHTML = one + one;   // doubled so the loop is seamless
    track.style.setProperty("--dur", `${Math.max(20, list.length * 6)}s`);
    track.classList.add("run");
  }
}

function showPrize(st){
  $("#pName").textContent = st.prize.name;
  $("#pQty").textContent = st.prize.qty;
  $("#pPool").textContent = st.pool.label;
  $("#pCount").textContent = st.pool.count;
  go("prize");
}

// countdown while the deck shuffles; no other names are shown on screen
function showDrawing(st, done){
  go("drawing");
  $("#dSub").textContent = `กำลังสุ่ม ${st.prize.name}`;
  const secs = Math.max(1, st.countdown || 5), el = $("#count");
  for(let i = 0; i < secs; i++){
    later(() => {
      el.textContent = secs - i;
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
    }, i * 1000);
  }
  later(done, secs * 1000);
}

function showReveal(st, instant){
  const w = st.winner, ch = w.c ? D.CHARS[w.c] : null;
  const back = `<img src="prize-assets/cards/back.webp" alt="">`;
  $("#card").innerHTML = ch
    ? `<div class="flip"><div class="flip-in"><div class="face">${back}</div>
        <div class="face front"><video src="prize-assets/cardvid/${w.c}.mp4" poster="prize-assets/cards/${w.c}.webp" autoplay loop muted playsinline></video></div></div></div>`
    : `<div class="flip solo"><div class="flip-in"><div class="face">${back}</div></div></div>`;
  const name = nm(w.n), h1 = $("#wName");
  h1.textContent = name;
  $("#wLine").textContent = st.prize.name;
  // the winner joins the ticker only once revealed
  if(!st.winners.some(x => x.id === w.id)) renderTicker([...st.winners, { ...w, prize: st.prize.name }]);
  $("#wMeta").textContent = D.TICKETS[w.t];
  $("#wSide").innerHTML = ch ? `<div class="char">${ch}</div>` : "";
  go("reveal");
  // shrink the name until it fits the column (layout px, unaffected by the stage scale)
  h1.style.fontSize = "";
  const max = h1.parentElement.clientWidth;
  if(h1.scrollWidth > max) h1.style.fontSize = `${Math.floor(170 * max / h1.scrollWidth)}px`;
  const flip = $("#card .flip:not(.solo)");
  if(flip){ instant ? flip.classList.add("on") : later(() => flip.classList.add("on"), 500); }
  if(!instant) later(confetti, ch ? 900 : 300);
}

function showBoard(st){
  const list = st.winners.slice(-12);
  $("#grid").className = list.length ? "grid" : "";
  $("#grid").innerHTML = list.length ? list.map(w => `<div class="tile">
      <img src="prize-assets/cards/${w.c || "back"}.webp" alt="">
      <div><b>${esc(nm(w.n))}</b><small>${esc(w.prize)} ที่ ${w.no}</small></div></div>`).join("")
    : `<p class="empty">ยังไม่มีผู้ได้รับรางวัล</p>`;
  go("board");
}

let lastSeq = -1;
function apply(st, instant){
  if(st.seq === lastSeq) return;
  lastSeq = st.seq;
  clearTimers();
  renderTicker(st.winners || []);
  switch(st.scene){
    case "prize": showPrize(st); break;
    case "drawing":
      if(instant){ showReveal(st, true); break; }
      if(st.redraw){
        go("redraw");
        $("#rSub").textContent = `${st.prize.name} · ผู้มีสิทธิ์ ${st.pool.count} คน`;
        later(() => showDrawing(st, () => showReveal(st)), 1800);
      } else showDrawing(st, () => showReveal(st));
      break;
    case "reveal": showReveal(st, instant); break;
    case "board": showBoard(st); break;
    case "blank": go("blank"); break;
    default: go("idle");
  }
}

// ---- confetti in the brand rim palette ----
const cv = $("#confetti"), cx = cv.getContext("2d");
const COLORS = ["#00d4fe","#1f87e6","#113cf3","#722df4","#e63bd8","#f79319","#ffffff","#cfd8ea"];
// falls from the top edge only: a ~2s shower across the full width; each piece fades out
// between FADE_FROM and FADE_TO so nothing reaches the winners ticker (top edge at y=1004)
const FADE_FROM = 700, FADE_TO = 980;
let parts = [], raf = 0, emitUntil = 0;
function confetti(){
  if(reduce) return;
  emitUntil = performance.now() + 2000;
  if(!raf) raf = requestAnimationFrame(tick);
}
function spawn(n){
  for(let i = 0; i < n; i++) parts.push({
    x: Math.random() * 1920, y: -20 - Math.random() * 60,
    vx: (Math.random() - .5) * 1.6, vy: 2 + Math.random() * 3,
    w: 10 + Math.random() * 12, h: 6 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .25,
    sway: Math.random() * Math.PI * 2, c: COLORS[Math.floor(Math.random() * COLORS.length)], life: 0,
  });
}
function tick(){
  const emitting = performance.now() < emitUntil;
  if(emitting) spawn(4);
  cx.clearRect(0, 0, 1920, 1080);
  parts = parts.filter(p => p.y < FADE_TO);
  for(const p of parts){
    p.life++; p.sway += .05;
    p.vy = Math.min(p.vy + .05, 6.5);
    p.x += p.vx + Math.sin(p.sway) * 1.2; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c;
    cx.globalAlpha = p.y < FADE_FROM ? 1 : Math.max(0, 1 - (p.y - FADE_FROM) / (FADE_TO - FADE_FROM));
    cx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.life / 8)), p.w, p.h);
    cx.restore();
  }
  raf = parts.length || emitting ? requestAnimationFrame(tick) : 0;
}

const params = new URLSearchParams(location.search);

if(params.has("demo")){
  // ---- demo mode: plays a sample sequence by itself, never joins the live channel ----
  document.body.classList.add("is-demo");
  const STEPS = [["idle", 4000], ["prize", 5000], ["drawing", 13000], ["board", 6000]];
  let seq = 1000, prizeIdx = 0, winner = null, list = [], step = 0, loop = 0, rounds = 0, paused = false;

  const pickWinner = () => {
    const won = new Set(list.map(w => w.id));
    let pool = D.PEOPLE.filter(p => !won.has(p.id));
    if(!pool.length){ list = []; pool = D.PEOPLE.slice(); }
    const p = D.PRIZES[prizeIdx];
    let no = list.filter(w => w.prize === p.name).length + 1;
    if(no > p.qty){ list = list.filter(w => w.prize !== p.name); no = 1; }   // prize used up: start its numbering again
    const x = pool[Math.floor(Math.random() * pool.length)];
    winner = { id: x.id, n: x.n, t: x.t, c: x.c, no };
    list.push({ ...winner, prize: p.name });
  };
  const state = scene => {
    const p = D.PRIZES[prizeIdx], used = list.filter(w => w.prize === p.name).length;
    return {
      scene, seq: ++seq, countdown: 5,
      prize: { name: p.name, qty: p.qty, left: Math.max(0, p.qty - used) },
      pool: { label: "ผู้ถือบัตรทุกประเภท", count: D.PEOPLE.length - list.length + (scene === "drawing" ? 1 : 0) },
      winner,
      // the winner being drawn is not on the ticker until the reveal
      winners: scene === "drawing" || scene === "reveal" ? list.slice(0, -1) : list,
    };
  };
  const schedule = ms => { clearTimeout(loop); if(!paused) loop = setTimeout(() => run(step + 1), ms); };
  const run = (i, jumped) => {
    step = (i + STEPS.length) % STEPS.length;
    const [scene, ms] = STEPS[step];
    if(scene === "idle" && !jumped && rounds++ > 0) prizeIdx = (prizeIdx + 1) % D.PRIZES.length;
    if(scene === "drawing") pickWinner();
    apply(state(scene), false);
    schedule(ms);
  };
  const jump = scene => {
    if(scene === "reveal"){
      pickWinner(); apply(state("reveal"), false);
      step = 2; schedule(8000);
      return;
    }
    run(STEPS.findIndex(s => s[0] === scene), true);
  };
  window.demoJump = jump;

  // controls appear while the mouse moves, then hide again
  let hide = 0;
  const wake = () => { document.body.classList.add("bar-on"); clearTimeout(hide); hide = setTimeout(() => document.body.classList.remove("bar-on"), 2500); };
  addEventListener("mousemove", wake); addEventListener("touchstart", wake);
  $("#demoBar").addEventListener("dblclick", e => e.stopPropagation());
  $("#demoBar").addEventListener("click", e => {
    const b = e.target.closest("[data-demo]");
    if(b) jump(b.dataset.demo);
    if(e.target.closest("#demoFs")) toggleFs();
    if(e.target.closest("#demoPause")){
      paused = !paused;
      $("#demoPause").textContent = paused ? "เล่นต่อ" : "หยุด";
      paused ? clearTimeout(loop) : schedule(1500);
    }
  });
  wake();
  run(0);
} else {
  // ---- live: sync with the Control Panel ----
  const ch = new BroadcastChannel(D.CHANNEL);
  let first = true;
  ch.onmessage = e => {
    if(e.data?.t !== "state") return;
    apply(e.data.state, first && e.data.replay);  // a reply to "hello" jumps to the end state
    first = false;
  };
  const preview = params.has("preview");
  ch.postMessage({ t: "hello", preview });
  addEventListener("pagehide", () => ch.postMessage({ t: "bye", preview }));
  go("idle");
}
</script>
