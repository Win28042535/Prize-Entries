<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Lucky Draw Show Screen</title>
<link rel="preload" href="prize-assets/fonts/fc-minimal-600-900.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face{font-family:"FC Minimal";src:url("prize-assets/fonts/fc-minimal-100-500.ttf") format("truetype");font-weight:100 500;font-display:swap}
  @font-face{font-family:"FC Minimal";src:url("prize-assets/fonts/fc-minimal-600-900.ttf") format("truetype");font-weight:600 900;font-display:swap}
  @font-face{font-family:"Baskervville";src:url("prize-assets/fonts/baskervville-400-700.ttf") format("truetype");font-weight:400 700;font-display:swap}

  /* ---- Design DNA: BetterTrade 2026 ---- */
  :root{
    --ink:#111318; --ink-2:#687078; --ink-3:#687078;   /* DNA secondary text */
    --line:rgba(17,19,24,.14);
    --blue:#6598FF; --blue-ink:#1863DC; --blue-tint:rgba(234,242,255,.78);
    --banner:linear-gradient(180deg,#0B0D14 0%,#1B2240 100%);
    --rim:linear-gradient(90deg,#00d4fe,#1f87e6,#113cf3,#722df4,#e63bd8,#f79319);
    --serif:"Baskervville","Times New Roman",serif;
    --sans:"FC Minimal",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}

  /* Two LED screens, one canvas each (set in JS from ?screen=, key S):
       mini  Mini Stage 5.5 x 3 m = 1408 x 768  -> virtual 1920 x 1047 (scale .73)
       main  Main Stage 16 x 4 m  = 4096 x 1024 -> virtual 3320 x 830  (scale 1.23, exactly 4:1)
     The virtual canvas uses the original design units and is scaled to the screen's real pixels,
     then letterboxed in black inside the window. Main Stage is laid out in three zones:
     glass pieces left, content centre, ship + gift right. */
  #frame{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1047px;transform-origin:center;overflow:hidden;
    background:linear-gradient(180deg,#F6F7FB 0%,#E9EDF6 100%)}
  /* everything is composed on a 1920-wide core centred in the stage; on Main Stage the stage adds wings around it */
  #core{position:absolute;top:0;bottom:0;left:50%;width:1920px;margin-left:-960px}
  .wing,.wing-el,.seam{display:none}
  body.screen-main .wing,body.screen-main .wing-el,body.screen-main .seam{display:block}
  /* wings continue the walls' grey outer edge and lighten towards the ends of the 16 m screen */
  .wing{position:absolute;top:0;bottom:0;width:1300px;pointer-events:none}
  .wing.l{right:calc(100% + 323px);background:linear-gradient(270deg,#C8C9CE 0%,#DADCE1 25%,#E9EBF1 65%,#E3E6ED 100%)}
  .wing.r{left:2273px;background:linear-gradient(90deg,#C8C9CE 0%,#DADCE1 25%,#E9EBF1 65%,#E3E6ED 100%)}
  /* feather the walls' grey outer edge into the wing colour so there is no seam */
  .seam{position:absolute;top:0;bottom:0;width:260px;pointer-events:none}
  .seam.l{left:-325px;background:linear-gradient(90deg,#C8C9CE,rgba(200,201,206,0))}
  .seam.r{left:2015px;background:linear-gradient(270deg,#C8C9CE,rgba(200,201,206,0))}
  .wing-el{position:absolute;filter:drop-shadow(0 22px 26px rgba(63,111,224,.2));animation:bob 7s ease-in-out infinite}
  /* Main Stage pieces in three depth layers, from the wings in to the sky around the content:
       far   (wings, small)            gold bars b, compass c
       mid   (straddling the wall edge) candle, chest, ship
       near  (in the sky, clear of text) diamond n1, coin n2, gift, efin */
  .wing-el.b{left:-640px;bottom:240px;width:130px;animation-delay:-4.5s}
  .wing-el.c{left:2440px;top:140px;width:110px;animation-delay:-1s}
  .wing-el.n1{left:340px;top:120px;width:120px;animation-delay:-3s}
  .wing-el.n2{left:1940px;top:360px;width:110px;animation-delay:-5.5s}   /* between the name's right edge (~1560) and the ship (~2274), a little nearer the ship */
  /* the logo row follows the edges of the whole 4:1 screen (same 96px margin as Mini Stage), not the 1920 core */
  body.screen-main .top{left:-604px;right:-604px}
  body.screen-main .wall.l{left:-325px}
  body.screen-main .wall.r{left:1559px}
  body.screen-main .el.candle{left:-200px;top:200px}   /* bar centred between the far gold bars (~-510) and the name's left edge (~360) */
  body.screen-main .el.chest{left:77px;bottom:70px}   /* centred between the bar chart (~-75) and the near diamond (~400) */
  body.screen-main .el.gift{right:auto;left:1560px;top:150px;width:170px}   /* below the corner label, which is larger on Main Stage */
  body.screen-main .ship{right:-660px;height:300px}   /* right zone, clear of the board */
  body.screen-main .el.efin{right:auto;bottom:auto;left:1680px;top:640px;width:120px}
  /* the 4-column board fills the sky, so the mid and near pieces step aside there (far pieces and the ship stay) */
  .el,.wing-el{transition:opacity .6s}
  body.screen-main #stage[data-scene="board"] :is(.el.candle,.el.chest,.el.gift,.el.efin,.wing-el.n1,.wing-el.n2){opacity:0}
  /* ---- KV backdrop: sky seen between two white walls (key visual), layered so each part can move ---- */
  .sky{position:absolute;top:0;left:-6%;width:112%;height:100%;background:url("prize-assets/img/kv-sky.webp") center/cover no-repeat;
    animation:drift 70s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translateX(-5%)}}
  /* walls are cut from the KV along the sky edge and pushed apart so the gap is wide enough for the content */
  .wall{position:absolute;top:0;height:1600px;pointer-events:none}
  .wall.l{left:-125px}
  .wall.r{left:1359px}
  /* soft white wash behind the content, so blue text never sits on blue sky */
  .halo{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 560px 340px at 50% 56%,rgba(255,255,255,.82),rgba(255,255,255,.5) 55%,rgba(255,255,255,0) 100%)}
  .floor{position:absolute;left:-1200px;right:-1200px;bottom:0;height:300px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.85))}

  /* the ship is the gimmick: bottom-right, same size and place in every scene, behind all content */
  .ship{position:absolute;right:28px;bottom:0;height:280px;filter:drop-shadow(0 20px 40px rgba(17,19,24,.18))}

  /* glass elements stay at the edges so the centre is free for names; the ship carries its own set */
  .el{position:absolute;filter:drop-shadow(0 26px 30px rgba(63,111,224,.22));animation:bob 6s ease-in-out infinite}
  .el.candle{left:-5px;top:300px;width:250px;animation-delay:-1s}
  .el.chest{left:240px;bottom:112px;width:170px;animation-delay:-3s}
  .el.efin{right:356px;bottom:64px;width:124px;animation-delay:-2s}
  .el.gift{right:138px;top:106px;width:190px;animation-delay:-1.5s}
  @keyframes bob{50%{transform:translateY(-18px) rotate(-3deg)}}

  .top{position:absolute;left:96px;right:96px;top:64px;display:flex;justify-content:space-between;align-items:center;z-index:5}
  .top img{height:46px}
  .eyebrow{font-family:var(--serif);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:inline-flex;align-items:center;gap:16px;font-size:24px}
  .eyebrow::after{content:"";width:96px;height:1px;background:var(--ink);opacity:.5}
  .eyebrow i{font-style:normal;font-size:16px;color:var(--ink)}

  /* scenes */
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    opacity:0;transform:translateY(24px) scale(.985);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:4}
  .scene.on{opacity:1;transform:none}
  .k{font-family:var(--serif);letter-spacing:.1em;text-transform:uppercase;font-size:26px;color:var(--blue-ink);display:flex;align-items:center;gap:18px;justify-content:center}
  .k::before,.k::after{content:"";width:72px;height:1px;background:currentColor;opacity:.6}

  /* idle */
  /* the headline leads; the event logo is the supporting identity (64% of its old width) */
  .idle img{width:240px;filter:drop-shadow(0 16px 32px rgba(17,19,24,.16))}
  .idle .k{margin-top:40px}
  .idle h2{margin:18px 0 6px;font-size:170px;font-weight:700}
  .idle p{margin-top:12px;font-size:46px;font-weight:700;color:var(--ink-2)}

  /* prize */
  .prize h2,.idle h2,.board h2{font-weight:600;font-size:150px;line-height:1.05;letter-spacing:-.01em}
  .prize{padding-bottom:90px}   /* optical centre sits a little above the middle */
  .prize h2{margin:20px 0 22px}
  .prize .qty{font-size:46px;font-weight:700;color:var(--ink-2);display:flex;align-items:baseline;justify-content:center;gap:14px}
  .prize .qty b{font-weight:700;font-size:110px;line-height:1;color:var(--ink)}
  /* same DNA as the winners-board tile: white glass, hairline border, bold ink value, blue-ink label */
  .rule{margin-top:48px;display:inline-flex;align-items:stretch;gap:18px}
  .rule div{padding:22px 44px;text-align:left;background:rgba(255,255,255,.82);border:1px solid var(--line);backdrop-filter:blur(6px)}
  .rule small{display:block;font-size:30px;font-weight:500;color:var(--blue-ink);margin-bottom:2px}
  .rule span{display:block;font-size:56px;font-weight:600;line-height:1.2}
  .rule .num{font-size:72px;font-weight:600;line-height:1.1}

  /* drawing */
  .deck{position:relative;width:300px;aspect-ratio:1418/1985;margin:34px 0 40px}
  .deck img{position:absolute;inset:0;width:100%;height:100%;border-radius:18px;box-shadow:0 30px 50px -20px rgba(17,19,24,.5)}
  .drawing.on .deck img{animation:shuffle .6s ease-in-out infinite;animation-delay:calc(var(--i) * -.2s)}
  @keyframes shuffle{0%,100%{transform:none}30%{transform:translateX(-120px) rotate(-10deg)}60%{transform:translateX(120px) rotate(10deg);z-index:2}}
  .drawing .deck{width:210px;margin:30px 0 18px}
  .count{font-size:260px;font-weight:500;line-height:1;min-height:260px;color:var(--ink)}
  .dv{display:none;flex-direction:column;align-items:center}
  body.draw-A .dv-A,body.draw-B .dv-B{display:flex}

  /* B: name wheel. 5 rows visible; the row on the centre band is full size and black, the others shrink and fade with distance */
  .reel{position:relative;width:1240px;height:600px;margin:24px 0 6px;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}
  .reel-band{position:absolute;left:0;right:0;top:calc(50% - 60px);height:120px;border-block:2px solid var(--blue);background:var(--blue-tint)}
  .reel-in{position:absolute;left:0;right:0;top:0;will-change:transform}
  .reel-in div{position:absolute;left:0;right:0;height:120px;line-height:120px;font-size:100px;font-weight:700;white-space:nowrap;color:var(--ink);text-align:center;will-change:transform,opacity}
  body.screen-main .reel{height:360px;margin-top:14px;width:1000px}
  /* Main Stage is only 830 tall: drawing A and the prize scene get a little more compact / less lifted */
  body.screen-main .drawing .deck{width:170px;margin:18px 0 8px}
  body.screen-main .dv-A .count{font-size:200px;min-height:200px}
  body.screen-main .prize{padding-bottom:20px}
  /* B: the wheel itself shows the countdown, so no number under it */
  .dv-B .count{display:none}

  .count.tick{animation:tick .9s cubic-bezier(.2,.8,.2,1)}
  @keyframes tick{from{transform:scale(1.35);opacity:0;color:var(--blue-ink)}to{transform:none;opacity:1}}
  .drawing .sub{font-size:46px;font-weight:700;color:var(--ink-2);margin-top:6px}

  /* redraw interstitial */
  .redraw h2{font-weight:600;font-size:110px;margin-top:24px}
  .redraw p{font-size:34px;color:var(--ink-2);margin-top:16px}

  /* reveal */
  /* reveal: one centred column, no character card */
  .who{width:1400px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .who .crown{width:92px;height:92px;display:block;filter:drop-shadow(0 10px 16px rgba(63,111,224,.3))}
  .lucky{margin-top:10px;font-size:36px;color:var(--ink-2);display:flex;align-items:center;gap:14px}
  .lucky i{font-style:normal;font-size:22px;color:var(--ink)}
  /* font size is fitted to the width in JS so long names stay on one line */
  .who h1{font-weight:600;font-size:170px;line-height:1.15;margin:6px 0 0;letter-spacing:-.01em;white-space:nowrap}
  .who .pline{margin-top:18px;font-size:120px;font-weight:700;line-height:1.15;color:var(--blue-ink)}
  .who .meta{margin-top:24px;font-size:46px;font-weight:700;color:var(--ink-2)}

  /* board */
  /* the ship keeps one size and place everywhere, so the board is compact and top-anchored: its grid ends above the ship's top (fitBoard checks it) */
  /* the block is centred in the free band between the logo row and the ship (padding set by fitBoard) */
  /* the block always starts at the same height as with a full 12-winner board, whatever the count or style;
     it grows downward and fitBoard shrinks the grid if it would reach the ship */
  .scene.board{justify-content:flex-start;padding:118px 0 24px}
  .board h2{font-size:100px;margin:4px 0 10px}
  /* 3 columns x up to 4 rows (12 winners); names and prizes are sized for reading from far away */
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;max-width:1596px;transform-origin:top center}
  .tile{width:520px;display:flex;gap:16px;align-items:center;text-align:left;padding:6px 12px;background:rgba(255,255,255,.82);border:1px solid var(--line);backdrop-filter:blur(6px)}
  .tile img{width:56px;aspect-ratio:1418/1985;border-radius:8px;flex:none;object-fit:cover}
  .tile > div{min-width:0;flex:1}
  .tile b{display:block;font-size:38px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile small{display:block;font-size:28px;font-weight:500;color:var(--blue-ink);margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Main Stage: the board sits centred in the content zone, 4 columns x 3 rows (wider than the 1920 core, overflowing it evenly) */
  body.screen-main .grid{width:2134px;max-width:none}
  body.screen-main .groups{width:2134px}
  .board .empty{font-size:46px;font-weight:700;color:var(--ink-2)}
  /* B: same grid, a big order number instead of the character card */
  .tile .rank{flex:none;width:80px;text-align:center;font-size:52px;font-weight:600;line-height:1;color:var(--blue-ink)}
  .grid.ranked .tile{padding:6px 18px 6px 8px}
  .grid.ranked .tile b{font-size:44px;font-weight:700}
  /* C: one glass column per prize, winners listed under the prize name */
  .groups{display:flex;gap:18px;justify-content:center;align-items:flex-start;width:1596px}
  .group{flex:1 1 0;min-width:0;max-width:none;text-align:left;background:rgba(255,255,255,.82);border:1px solid var(--line);backdrop-filter:blur(6px)}
  .group header{padding:14px 20px 12px;border-bottom:1px solid var(--line)}
  .group header b{display:block;font-size:40px;font-weight:700;line-height:1.2;color:var(--blue-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* prize name: the BetterTrade 2026 title highlight (.bt-title-highlight): rim-palette gradient clipped to the text,
     200% wide and drifting back and forth every 3s */
  .group header b,.grid:not(.ranked) .tile small,.tile .rank,.prize .qty b,.who .pline,.drawing .sub .hl{color:transparent;-webkit-text-fill-color:transparent;
    background:linear-gradient(90deg,#00D4FE 0%,#1F87E6 20%,#113CF3 35%,#722DF4 50%,#E63BD8 65%,#F79319 80%) 0% 50%/200% 100%;
    -webkit-background-clip:text;background-clip:text;animation:spectrum-flow 3s ease-in-out infinite alternate}
  /* the gradient spans the text itself, not the whole card width */
  .group header b,.grid:not(.ranked) .tile small{display:inline-block;max-width:100%;vertical-align:top;padding-right:4px}
  .group header b{font-weight:600}
  .grid:not(.ranked) .tile small{font-weight:600}
  /* title highlight also on: prize count (prize scene), prize name (reveal), prize name in "กำลังสุ่ม …" (drawing) */
  .prize .qty b,.who .pline,.drawing .sub .hl{padding:0 4px}
  @keyframes spectrum-flow{from{background-position:0% 50%}to{background-position:100% 100%}}
  /* the gradient spans the text itself (inline-block); still frames show it mid-flow: blue, violet, pink */
  body.still :is(.group header b,.grid:not(.ranked) .tile small,.tile .rank,.prize .qty b,.who .pline,.drawing .sub .hl){background-position:50% 50%}
  .group header small{display:block;margin-top:2px;font-size:28px;font-weight:700;color:var(--ink-2)}
  .group header small em{font-style:normal;font-size:36px;color:var(--ink);margin:0 4px}
  .group ol{list-style:none;padding:8px 20px 14px}
  .group li{display:flex;align-items:baseline;gap:14px;padding:4px 0;break-inside:avoid}
  /* a prize with many winners: wider, names in two columns */
  .group.many{flex-grow:2;max-width:1080px}
  .group.many ol{columns:2;column-gap:28px}
  .group li i{flex:none;width:52px;font-style:normal;font-size:40px;font-weight:700;line-height:1;color:var(--blue-ink);font-variant-numeric:lining-nums}
  .group li b{min-width:0;flex:1;font-size:36px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #confetti{position:absolute;inset:0;z-index:3;pointer-events:none}
  .guide{position:absolute;inset:54px 96px;border:2px dashed rgba(229,59,216,.7);z-index:9;display:none;pointer-events:none}
  .guide::after{content:"SAFE AREA · 5%";position:absolute;left:12px;top:8px;font:600 18px var(--sans);color:#e63bd8}
  body.show-guide .guide{display:block}
  .demo-badge{display:none;position:absolute;right:96px;bottom:36px;z-index:8;padding:8px 18px;border-radius:999px;font-size:20px;
    color:var(--ink-2);background:rgba(255,255,255,.8);border:1px solid var(--line)}
  .demo-badge b{font-family:var(--serif);font-weight:400;letter-spacing:.1em;margin-right:8px;color:var(--blue-ink)}
  body.is-auto .demo-badge{display:block}


  /* demo controls: outside the scaled stage, shown on mouse move */
  .demo-bar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);z-index:20;display:none;gap:6px;align-items:center;padding:6px;
    max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none;
    border-radius:999px;background:rgba(17,19,24,.82);backdrop-filter:blur(8px);opacity:0;transition:opacity .3s,transform .3s;font-family:var(--sans)}
  body.is-demo .demo-bar{display:flex}
  body.bar-on .demo-bar,body.bar-pin .demo-bar{opacity:1;transform:translate(-50%,0)}
  .demo-bar button{font:inherit;font-size:14px;color:#fff;background:none;border:0;cursor:pointer;height:44px;padding:0 14px;border-radius:999px;white-space:nowrap;flex:none}
  .demo-bar button:hover{background:rgba(255,255,255,.12)}
  .demo-bar button[aria-pressed="true"]{background:#fff;color:var(--ink)}
  .demo-bar .sep{width:1px;height:20px;background:rgba(255,255,255,.25);margin:0 4px}

  /* ---- Main Stage type scale (16 x 4 m at 256 px/m, canvas scale 1.23: 1 design px is about 0.48 cm of letter height).
     Sized for viewers up to ~30 m: no text below 38 (about 18 cm), secondary lines 64 (about 31 cm),
     small text at weight 600 so it does not thin out on LED. Headings and names keep their sizes. ---- */
  /* level 4, chrome: corner label, small kickers, group ordinals */
  body.screen-main .top img{height:60px}
  body.screen-main .eyebrow{font-size:38px;gap:22px}
  body.screen-main .eyebrow i{font-size:24px}
  body.screen-main .eyebrow::after{width:130px}
  body.screen-main .k{font-size:38px;gap:24px}
  body.screen-main .k::before,body.screen-main .k::after{width:100px}
  body.screen-main .lucky i{font-size:30px}
  body.screen-main .group li i{font-size:64px;width:84px;font-weight:700}
  /* level 3, labels and data */
  body.screen-main .lucky{font-size:52px}
  body.screen-main .rule small{font-size:44px;font-weight:600}
  body.screen-main .rule span{font-size:76px}
  body.screen-main .rule .num{font-size:100px}
  body.screen-main .tile small{font-size:44px;font-weight:600}
  body.screen-main .group header b{font-size:52px}
  body.screen-main .group header small{font-size:44px}
  body.screen-main .group header small em{font-size:56px}
  /* level 2, secondary lines */
  body.screen-main .idle p,body.screen-main .drawing .sub,body.screen-main .who .meta,body.screen-main .board .empty,body.screen-main .redraw p{font-size:64px;font-weight:700}
  body.screen-main .prize .qty{font-size:64px}
  body.screen-main .prize .qty b{font-size:140px}
  /* board names: bigger, so the tiles get wider (3 x 700 per row) */
  body.screen-main .tile{width:700px}
  body.screen-main .tile img{width:72px}
  body.screen-main .tile b{font-size:56px}
  body.screen-main .tile .rank{font-size:72px;width:104px}
  body.screen-main .grid.ranked .tile b{font-size:60px}
  /* Main Stage: at most 3 tiles / prize groups per row (3 x 700 + 2 x 18 = 2136) */
  body.screen-main .grid,body.screen-main .groups{width:2136px}
  body.screen-main .group{max-width:none}
  body.screen-main .group li b{font-size:56px}
  /* reveal: a wider name column so long names shrink less */
  body.screen-main .who{width:1500px}

  /* ?still: every scene in its settled state, no motion (gallery thumbnails and PNG export) */
  body.still *,body.still *::before,body.still *::after{animation:none!important;transition:none!important}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="frame">
<div id="stage">
<div id="core">
  <div class="wing l"></div><div class="wing r"></div>

<script src="prize-assets/prize-data.js"></script>
<script>
const D = window.PRIZE_DATA;
const $ = s => document.querySelector(s);
const stage = $("#stage");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const params = new URLSearchParams(location.search);
const STILL = params.has("still");
if(STILL) document.body.classList.add("still");
const rand = STILL ? (() => { let x = 7; return () => (x = (x * 9301 + 49297) % 233280) / 233280; })() : Math.random;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// size from the layout viewport (clientWidth/Height), not innerWidth: on phones innerWidth follows pinch-zoom
const SCREENS = {
  mini: { w: 1408, h: 768,  vw: 1920, vh: 1047 },   // Mini Stage 5.5 x 3 m
  main: { w: 4096, h: 1024, vw: 3320, vh: 830 },    // Main Stage 16 x 4 m
};
let screen = "mini";
function fit(){
  const el = document.documentElement, S = SCREENS[screen];
  // fit the real screen size into the window, then map the virtual canvas onto it
  const s = Math.min(el.clientWidth / S.w, el.clientHeight / S.h) * (S.w / S.vw);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
function setScreen(x){
  const first = !stage.dataset.sized;
  if(x === "wide") x = "main";   // older links
  screen = SCREENS[x] ? x : "mini";
  const S = SCREENS[screen];
  stage.style.width = S.vw + "px"; stage.style.height = S.vh + "px";
  Object.keys(SCREENS).forEach(k => document.body.classList.toggle("screen-" + k, k === screen));
  document.querySelectorAll("#demoBar [data-screen]").forEach(b => b.setAttribute("aria-pressed", b.dataset.screen === screen));
  fit();
  stage.dataset.sized = "1";
  if(!first && typeof lastBoard !== "undefined" && lastBoard && stage.dataset.scene === "board") showBoard(lastBoard);
}
addEventListener("resize", fit);
setScreen(params.get("screen"));

// browsers only allow fullscreen after a click/key in this page, so: F, double-click, or the demo bar button
const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
addEventListener("keydown", e => {
  if(e.key === "f" || e.key === "F") toggleFs();
  if(e.key === "g" || e.key === "G") document.body.classList.toggle("show-guide");
});
addEventListener("dblclick", toggleFs);

// records may have "-" as an empty surname (e.g. "Nathaporn -"): don't show it
const nm = s => String(s).replace(/(\s+-)+\s*$/, "").trim() || String(s);

let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
let reelRaf = 0;
function clearTimers(){ timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(reelRaf); }

// ---- drawing style: A cards / B name reel (V cycles, ?draw=B picks) ----
const STYLES = ["A", "B"];
let drawStyle = "A";
function setDraw(x){
  drawStyle = STYLES.includes(x) ? x : "A";
  STYLES.forEach(k => document.body.classList.toggle("draw-" + k, k === drawStyle));
  document.querySelectorAll("#demoBar [data-draw]").forEach(b => b.setAttribute("aria-pressed", b.dataset.draw === drawStyle));
}

// ---- winners board style: A character cards / B order numbers / C grouped by prize (T cycles, ?board=B picks) ----
const BOARDS = ["A", "B", "C"];
let boardStyle = "A", lastBoard = null;
function setBoard(x){
  boardStyle = BOARDS.includes(x) ? x : "A";
  document.querySelectorAll("#demoBar [data-board]").forEach(b => b.setAttribute("aria-pressed", b.dataset.board === boardStyle));
  if(lastBoard && stage.dataset.scene === "board") showBoard(lastBoard);
}

// webfonts change text metrics: re-fit the board once they have loaded
document.fonts?.ready.then(() => { if(lastBoard && stage.dataset.scene === "board") showBoard(lastBoard); });

const ROW = 120;
function startReel(st, dur){
  const names = D.PEOPLE.map(p => nm(p.n));
  for(let i = names.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [names[i], names[j]] = [names[j], names[i]]; }
  const N = 40, rows = [];
  for(let i = 0; i < N - 1; i++) rows.push(names[i % names.length]);
  rows.push(st.winner ? nm(st.winner.n) : names[0]);
  const inner = $("#reelIn");
  inner.innerHTML = rows.map((n, i) => `<div style="top:${i * ROW}px">${esc(n)}</div>`).join("");
  const els = [...inner.children], WIN = inner.parentElement.clientHeight;
  // p = which row sits on the centre band (fractional while rolling); distance d from it drives size and fade
  const set = p => {
    inner.style.transform = `translateY(${(WIN - ROW) / 2 - p * ROW}px)`;
    els.forEach((el, i) => {
      const d = Math.abs(i - p);
      el.style.transform = `scale(${1 / (1 + .62 * d)})`;
      el.style.opacity = d > 2.6 ? 0 : 1 / (1 + 1.1 * d);
    });
  };
  if(STILL){ set(N - 6); return; }
  set(1);
  const t0 = performance.now(), len = Math.max(600, dur - 250);
  const step = now => {
    const k = Math.min(1, (now - t0) / len);
    set(1 + (N - 2) * (1 - Math.pow(1 - k, 4)));
    if(k < 1) reelRaf = requestAnimationFrame(step);
  };
  reelRaf = requestAnimationFrame(step);
}

function go(scene){
  stage.dataset.scene = scene;
  document.querySelectorAll(".scene").forEach(s => s.classList.toggle("on", s.dataset.scene === scene));
  if(scene !== "reveal"){ parts = []; emitUntil = 0; }
  const chip = scene === "redraw" ? "drawing" : scene;
  document.querySelectorAll("#demoBar [data-demo]").forEach(b => b.setAttribute("aria-pressed", b.dataset.demo === chip));
}

function showPrize(st){
  $("#pName").textContent = st.prize.name;
  $("#pQty").textContent = st.prize.qty;
  $("#pPool").textContent = st.pool.label;
  $("#pCount").textContent = st.pool.count;
  go("prize");
}

// countdown while the deck shuffles; no other names are shown on screen
function showDrawing(st, done){
  go("drawing");
  $("#dSub").innerHTML = `กำลังสุ่ม <span class="hl">${esc(st.prize.name)}</span>`;
  const secs = Math.max(1, st.countdown || 5), els = document.querySelectorAll(".count");
  if(drawStyle === "B") startReel(st, secs * 1000);
  if(STILL){ els.forEach(el => el.textContent = Math.min(3, secs)); return; }
  for(let i = 0; i < secs; i++){
    later(() => {
      els.forEach(el => { el.textContent = secs - i; el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick"); });
    }, i * 1000);
  }
  later(done, secs * 1000);
}

function showReveal(st, instant){
  const w = st.winner;
  const name = nm(w.n), h1 = $("#wName");
  h1.textContent = name;
  $("#wLine").textContent = st.prize.name;
  $("#wMeta").textContent = D.TICKETS[w.t];
  go("reveal");
  // shrink the name until it fits the column (layout px, unaffected by the stage scale)
  h1.style.fontSize = "";
  const max = h1.parentElement.clientWidth;
  if(h1.scrollWidth > max) h1.style.fontSize = `${Math.floor(170 * max / h1.scrollWidth)}px`;
  // the prize stays prominent but never outgrows the winner name: at most 85% of its size
  const nameSize = parseFloat(getComputedStyle(h1).fontSize);
  $("#wLine").style.fontSize = `${Math.min(120, Math.floor(nameSize * .85))}px`;
  if(!instant) later(confetti, 300);
}

// whatever the data, keep the board above the ship: scale it down if its bottom would reach the ship's top
function fitBoard(){
  const grid = $("#grid"), ship = document.querySelector(".ship");
  grid.style.transform = "";
  const g = grid.getBoundingClientRect(), sh = ship.getBoundingClientRect();
  const overShip = g.left < sh.right && g.right > sh.left;
  const scene = grid.closest(".scene");
  // free band: below the logo row, down to the ship's top (only where the board is over the ship) or the screen's bottom margin
  const bandBottom = overShip ? stage.clientHeight - ship.offsetHeight - 24 : stage.clientHeight - 24;
  const head = document.querySelector(".top");
  // kicker top with a full 12-winner board: Mini 152, Main just under the (taller) logo row
  const MINI_TOP = 152;
  scene.style.padding = `${screen === "mini" ? MINI_TOP : head.offsetTop + head.offsetHeight + 8}px 0 ${stage.clientHeight - bandBottom}px`;
  const top = grid.offsetTop, h = grid.offsetHeight;
  const limit = bandBottom - 6;
  if(top + h > limit) grid.style.transform = `scale(${Math.max(.5, (limit - top) / h).toFixed(3)})`;
}

function showBoard(st){
  lastBoard = st;
  // at most 3 rows of 3 on Main Stage (latest 9), 4 rows of 3 on Mini Stage (latest 12)
  const list = st.winners.slice(screen === "main" ? -9 : -12), grid = $("#grid");
  const label = w => `${esc(w.prize)} ที่ ${w.no}`;
  if(!list.length){
    grid.className = "";
    grid.innerHTML = `<p class="empty">ยังไม่มีผู้ได้รับรางวัล</p>`;
  } else if(boardStyle === "C"){
    // group by prize in the order prizes were first drawn; keep the latest 3 groups (one row, at most 3 per row on both screens)
    const groups = [];
    for(const w of st.winners.slice(-12)){   // C counts from the full recent list, not the 9 tiles A/B show on Main Stage
      let g = groups.find(x => x.prize === w.prize);
      if(!g) groups.push(g = { prize: w.prize, people: [] });
      g.people.push(w);
    }
    grid.className = "groups";
    grid.innerHTML = groups.slice(-3).map(g => {
      const qty = (D.PRIZES.find(p => p.name === g.prize) || {}).qty;
      // Main Stage: at most 3 rows of names per prize (two columns of 3 when needed, latest names); Mini: one column up to 5, then two
      const many = g.people.length > (screen === "main" ? 3 : 5);
      const shown = screen === "main" ? g.people.slice(many ? -6 : -3) : g.people;
      return `<section class="group${many ? " many" : ""}"><header><b>${esc(g.prize)}</b><small>ผู้โชคดี<em>${g.people.length}</em>${qty ? `จาก ${qty} ` : ""}รางวัล</small></header>
        <ol>${shown.map(w => `<li><i>${w.no}</i><b>${esc(nm(w.n))}</b></li>`).join("")}</ol></section>`;
    }).join("");
  } else {
    grid.className = boardStyle === "B" ? "grid ranked" : "grid";
    const first = st.winners.length - list.length;
    grid.innerHTML = list.map((w, i) => `<div class="tile">
      ${boardStyle === "B" ? `<span class="rank">${String(first + i + 1).padStart(2, "0")}</span>` : `<img src="prize-assets/cards/${w.c || "back"}.webp" alt="">`}
      <div><b>${esc(nm(w.n))}</b><small>${label(w)}</small></div></div>`).join("");
  }
  go("board");
  fitBoard();
  // long names shrink to fit (down to 26px), then ellipsis
  grid.querySelectorAll("b").forEach(el => {
    el.style.fontSize = "";
    if(el.scrollWidth > el.clientWidth){
      const base = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = Math.max(26, Math.floor(base * el.clientWidth / el.scrollWidth)) + "px";
    }
  });
  fitBoard();
}

let lastSeq = -1;
function apply(st, instant){
  if(st.seq === lastSeq) return;
  lastSeq = st.seq;
  clearTimers();
  switch(st.scene){
    case "prize": showPrize(st); break;
    case "drawing":
      if(instant && !STILL){ showReveal(st, true); break; }
      if(st.redraw){
        go("redraw");
        $("#rSub").textContent = `${st.prize.name} · ผู้มีสิทธิ์ ${st.pool.count} คน`;
        later(() => showDrawing(st, () => showReveal(st)), 1800);
      } else showDrawing(st, () => showReveal(st));
      break;
    case "reveal": showReveal(st, instant || STILL); break;
    case "board": showBoard(st); break;
    default: go("idle");
  }
}

// ---- confetti in the brand rim palette ----
const cv = $("#confetti"), cx = cv.getContext("2d");
const COLORS = ["#00d4fe","#1f87e6","#113cf3","#722df4","#e63bd8","#f79319","#ffffff","#cfd8ea"];
// A brief gimmick, not a show: about 45 small pieces over ~1.2s, falling from the top edge through
// the centre, drawn behind the text so the winner name stays readable. Each piece fades out
// between FADE_FROM and FADE_TO and is gone ~3.5s after the reveal.
const FADE_FROM = 620, FADE_TO = 940;
const RATE = 38;                                      // pieces per second while emitting
const BANDS = [[380, 1540]];                          // x range (1920 stage): the centre, falling from the top edge, drawn behind the text
let parts = [], raf = 0, emitUntil = 0, lastT = 0, acc = 0;
function confetti(){
  if(reduce) return;
  emitUntil = performance.now() + 1200; lastT = performance.now(); acc = 0;
  if(!raf) raf = requestAnimationFrame(tick);
}
function spawn(){
  const [a, b] = BANDS[Math.floor(Math.random() * BANDS.length)];
  parts.push({
    x: a + Math.random() * (b - a), y: -20 - Math.random() * 40,
    vx: (Math.random() - .5) * .8, vy: 4 + Math.random() * 3,
    w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - .5) * .25,
    sway: Math.random() * Math.PI * 2, c: COLORS[Math.floor(Math.random() * COLORS.length)], life: 0,
  });
}
function tick(){
  const now = performance.now(), emitting = now < emitUntil;
  if(emitting){ acc += (now - lastT) * RATE / 1000; while(acc >= 1){ spawn(); acc--; } }
  lastT = now;
  cx.clearRect(0, 0, 1920, 1080);
  parts = parts.filter(p => p.y < FADE_TO);
  for(const p of parts){
    p.life++; p.sway += .05;
    p.vy = Math.min(p.vy + .08, 9);
    p.x += p.vx + Math.sin(p.sway) * .9; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c;
    cx.globalAlpha = p.y < FADE_FROM ? 1 : Math.max(0, 1 - (p.y - FADE_FROM) / (FADE_TO - FADE_FROM));
    cx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.life / 8)), p.w, p.h);
    cx.restore();
  }
  raf = parts.length || emitting ? requestAnimationFrame(tick) : 0;
}

setDraw(params.get("draw"));
setBoard(params.get("board"));

// ---- controller: staff drive the scenes by hand (keys / bar / ?scene=). ?demo auto-plays a loop.
//      Preview params: ?still (settled frame, no motion), ?case=long|nosurname, ?n=0..12 winners on the board ----
{
  const auto = params.has("demo") && !STILL;
  if(!STILL) document.body.classList.add("is-demo");
  if(auto) document.body.classList.add("is-auto");
  if(params.has("bar") && !STILL) document.body.classList.add("bar-pin");
  const STEPS = [["idle", 4000], ["prize", 5000], ["drawing", 13000], ["board", 6000]];
  let seq = 1000, prizeIdx = Math.max(0, Math.min(D.PRIZES.length - 1, (+params.get("prize") || 1) - 1)),
      winner = null, list = [], step = 0, loop = 0, rounds = 0, paused = !auto, redrawFlag = false;

  // test cases for checking how the text holds up
  const kase = params.get("case");
  const LONG = "ณัฐพงศ์ศักดิ์ศรี เจริญรุ่งเรืองวงศ์ตระกูล";
  const pickWinner = (useCase = true) => {
    const won = new Set(list.map(w => w.id));
    let pool = D.PEOPLE.filter(p => !won.has(p.id));
    if(!pool.length){ list = []; pool = D.PEOPLE.slice(); }
    const p = D.PRIZES[prizeIdx];
    let no = list.filter(w => w.prize === p.name).length + 1;
    if(no > p.qty){ list = list.filter(w => w.prize !== p.name); no = 1; }   // prize used up: start its numbering again
    let x = pool[Math.floor(rand() * pool.length)];
    if(useCase && kase === "nosurname") x = D.PEOPLE.find(q => /\s-\s*$/.test(q.n)) || x;
    if(useCase && kase === "long") x = { ...x, n: LONG };
    winner = { id: x.id, n: x.n, t: x.t, c: x.c, no };
    list.push({ ...winner, prize: p.name });
  };
  // ?n= fills the board with that many earlier winners (still frames default to 6)
  const n = Math.max(0, Math.min(12, params.has("n") ? +params.get("n") || 0 : STILL ? 6 : 0));
  const keepPrize = prizeIdx;
  for(let i = 0; i < n; i++){ prizeIdx = i % D.PRIZES.length; pickWinner(i === 0); }
  prizeIdx = keepPrize;

  const state = scene => {
    const p = D.PRIZES[prizeIdx], used = list.filter(w => w.prize === p.name).length;
    return {
      scene, seq: ++seq, countdown: 5, redraw: redrawFlag && scene === "drawing",
      prize: { name: p.name, qty: p.qty, left: Math.max(0, p.qty - used) },
      pool: { label: "ผู้ถือบัตรทุกประเภท", count: D.PEOPLE.length - list.length + (scene === "drawing" ? 1 : 0) },
      winner,
      winners: scene === "drawing" || scene === "reveal" ? list.slice(0, -1) : list,
    };
  };
  const schedule = ms => { clearTimeout(loop); if(!paused) loop = setTimeout(() => run(step + 1), ms); };
  const run = (i, jumped) => {
    step = (i + STEPS.length) % STEPS.length;
    const [scene, ms] = STEPS[step];
    if(scene === "idle" && !jumped && rounds++ > 0) prizeIdx = (prizeIdx + 1) % D.PRIZES.length;
    if(scene === "drawing") pickWinner();
    apply(state(scene), false);
    schedule(ms);
  };
  const jump = scene => {
    if(scene === "reveal"){
      pickWinner(); apply(state("reveal"), false);
      step = 2; schedule(8000);
      return;
    }
    run(Math.max(0, STEPS.findIndex(s => s[0] === scene)), true);
  };
  window.demoJump = jump;

  const nextPrize = d => { prizeIdx = (prizeIdx + d + D.PRIZES.length) % D.PRIZES.length; jump("prize"); };
  const redraw = () => {
    if(winner) list.pop();            // the redrawn winner goes back to the pool
    redrawFlag = true; jump("drawing"); redrawFlag = false;
  };
  const cycleDraw = () => { setDraw(STYLES[(STYLES.indexOf(drawStyle) + 1) % STYLES.length]); };
  // Space / arrow: idle > prize > drawing > board; the reveal follows the drawing by itself
  const SEQ = ["idle", "prize", "drawing", "board"];
  let cur = 0;
  const goto = i => { cur = (i + SEQ.length) % SEQ.length; jump(SEQ[cur]); };

  if(!STILL) addEventListener("keydown", e => {
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if("12345".includes(k) && k.length === 1) { jump(["idle","prize","drawing","reveal","board"][+k - 1]); cur = Math.max(0, SEQ.indexOf(["idle","prize","drawing","drawing","board"][+k - 1])); }
    else if(k === " " || k === "ArrowRight" || k === "PageDown"){ e.preventDefault(); goto(cur + 1); }
    else if(k === "ArrowLeft" || k === "PageUp"){ e.preventDefault(); goto(cur - 1); }
    else if(k === "]") nextPrize(1);
    else if(k === "[") nextPrize(-1);
    else if(k === "r" || k === "R") redraw();
    else if(k === "v" || k === "V") cycleDraw();
    else if(k === "s" || k === "S") setScreen(screen === "mini" ? "main" : "mini");
    else if(k === "t" || k === "T") setBoard(BOARDS[(BOARDS.indexOf(boardStyle) + 1) % BOARDS.length]);
    else if(k === "h" || k === "H") document.body.classList.toggle("bar-pin");
  });

  // controls: H pins the bar; with ?demo or ?bar they also appear while the mouse moves
  let hide = 0;
  const wake = () => { document.body.classList.add("bar-on"); clearTimeout(hide); hide = setTimeout(() => document.body.classList.remove("bar-on"), 2500); };
  if(auto || params.has("bar")){ addEventListener("mousemove", wake); addEventListener("touchstart", wake); }
  $("#demoBar").addEventListener("dblclick", e => e.stopPropagation());
  $("#demoBar").addEventListener("click", e => {
    const b = e.target.closest("[data-demo]");
    if(b) jump(b.dataset.demo);
    const d = e.target.closest("[data-draw]");
    if(d) setDraw(d.dataset.draw);
    const t = e.target.closest("[data-board]");
    if(t) setBoard(t.dataset.board);
    const sc = e.target.closest("[data-screen]");
    if(sc) setScreen(sc.dataset.screen);
    if(e.target.closest("#prizePrev")) nextPrize(-1);
    if(e.target.closest("#prizeNext")) nextPrize(1);
    if(e.target.closest("#redrawBtn")) redraw();
    if(e.target.closest("#demoFs")) toggleFs();
  });
  if(!STILL) wake();
  const first = params.get("scene") || "idle";
  if(auto) run(0); else { jump(first); cur = Math.max(0, SEQ.indexOf(first === "reveal" ? "drawing" : first)); }
}
</script>
